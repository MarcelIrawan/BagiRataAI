<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — BagiRata AI</title>
  <!--
    Served by Cloudflare Pages for any unmatched path, at any URL depth.
    Self-contained and root-absolute on purpose: a relative asset path here
    would resolve against the requested URL, not against /.

    This file's presence is also what turns Pages' SPA fallback (index.html
    with 200 for every missing path) into a genuine 404 — without it,
    scripts/check-deploy-exposure.sh would read a leak on every private path.
  -->
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: #faf6f0;
      color: #2d2a26;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    h1 { font-size: 4rem; margin: 0; line-height: 1; }
    p { margin: 0; }
    a { color: #b45309; }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>Halaman tidak ditemukan.</p>
  <p><a href="/">Kembali ke BagiRata AI</a></p>
</body>
</html>
