# Only `public/` is ever published.
#
# Everything else in the repo — `test/`, `docs/`, `GLOSSARY.md`, `AGENTS.md`,
# `package.json`, and the function source under `netlify/` — is therefore out of
# the deploy by construction: a new top-level file cannot leak by accident.
[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
